[workspace]
resolver = "2"
members = [
    "crates/veloce-ipc",
    "crates/veloce-core",
    "crates/veloce-net",
    "crates/veloce-sdk",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["VeloceSolutions"]
license     = "proprietary"

[workspace.dependencies]
# Async runtime
tokio       = { version = "1", features = ["full"] }

# Serialisation
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
bincode     = "1"
bytes       = "1"

# Error handling
anyhow      = "1"
thiserror   = "1"

# Logging
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utils
uuid        = { version = "1", features = ["v4"] }
chrono      = { version = "0.4", features = ["serde"] }
memmap2     = "0.9"
parking_lot = "0.12"

# Windows-specific (only compiled on Windows)
[target.'cfg(windows)'.workspace.dependencies]
windows-service = "0.6"
windows         = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Networking_WinSock",
] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true