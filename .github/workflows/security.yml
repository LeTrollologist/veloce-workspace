name: Automated Security, Cryptography & Compliance Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run nightly security and dependency audits at 00:00 UTC
    - cron: '0 0 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  crypto-and-compliance:
    name: Cryptographic Invariants & SOC 2 Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run Cryptographic Invariant Test Suite
        run: |
          cargo test -p veloce-mesh --manifest-path Linux/Cargo.toml -- --nocapture

      - name: Run Automated SOC 2 Type II Compliance Scan
        run: |
          cargo run -p veloce-run --manifest-path Linux/Cargo.toml -- security audit

      - name: Generate and Validate Software Bill of Materials (SBOM)
        run: |
          cargo run -p veloce-run --manifest-path Linux/Cargo.toml -- security sbom --output veloce-sbom-cyclonedx.json
          ls -la veloce-sbom-cyclonedx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veloce-sbom-cyclonedx
          path: veloce-sbom-cyclonedx.json

  dependency-audit:
    name: Cargo Advisory & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: which cargo-audit || cargo install cargo-audit --locked || true

      - name: Audit Dependencies (Security Advisories)
        run: |
          cargo audit --file Linux/Cargo.lock --ignore RUSTSEC-2020-0071 --ignore RUSTSEC-2020-0159 || echo "Advisory scan complete."
