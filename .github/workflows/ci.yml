# CI workflow — runs on every PR and main-branch push.
#
# Skips markdown/docs-only changes.
# Builds on Windows because veloce-core uses Windows-only APIs.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'RELEASE_NOTES*'
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    name: cargo check + test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check (all workspace crates)
        run: >
          cargo check
          -p veloce-ipc
          -p veloce-net
          -p veloce-mesh
          -p veloce-sdk
          -p veloce-core
          -p veloce-run

      # veloce-core tests require Administrator (the binary embeds requireAdministrator
      # in its manifest for service install / Job Objects / NRPT writes).
      # GitHub-hosted runners do NOT run as admin, so we skip veloce-core tests here.
      # Run them locally with an elevated prompt: cargo test -p veloce-core
      - name: cargo test (mesh + net — no elevation needed)
        run: |
          cargo test -p veloce-mesh
          cargo test -p veloce-net

      - name: clippy (deny warnings)
        run: >
          cargo clippy
          -p veloce-core
          -p veloce-run
          --
          -D warnings
