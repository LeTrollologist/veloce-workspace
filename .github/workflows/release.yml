# Release workflow — triggered by any v* tag push.
#
# Flow:
#   1. Build veloce-core.exe + veloce-run.exe (Rust, release profile)
#   2. Build the Dashboard (unsigned, no updater)
#   3. Stage binaries into apps/installer/src-tauri/resources/
#   4. Build the full installer NSIS bundle and attach it to the GitHub Release

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the GitHub Release

jobs:
  release-windows:
    name: Build & release (Windows x64)
    runs-on: windows-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Toolchains ───────────────────────────────────────────────────────────
      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Cargo cache ──────────────────────────────────────────────────────────
      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── 1. Build core service + CLI ──────────────────────────────────────────
      - name: Build veloce-core.exe and veloce-run.exe
        run: cargo build --release -p veloce-core -p veloce-run

      # ── 2. Build Dashboard ────────────────────────────────────────────────────
      - name: Install dashboard npm dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npx tauri build

      # ── 3. Stage binaries for installer ──────────────────────────────────────
      - name: Stage binaries into installer resources
        run: |
          New-Item -ItemType Directory -Force apps/installer/src-tauri/resources | Out-Null
          Copy-Item target/release/veloce-core.exe `
                    apps/installer/src-tauri/resources/veloce-core.exe
          Copy-Item apps/dashboard/src-tauri/target/release/veloce-dashboard.exe `
                    apps/installer/src-tauri/resources/veloce-dashboard.exe

      # ── 4. Build the full setup installer ────────────────────────────────────
      - name: Install installer npm dependencies
        working-directory: apps/installer
        run: npm ci

      - name: Build installer NSIS bundle
        working-directory: apps/installer
        run: npx tauri build

      - name: Create GitHub Release and attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name:     "VeloceNetwork ${{ github.ref_name }}"
          draft:    true
          files: |
            apps/installer/src-tauri/target/release/bundle/nsis/*.exe
            target/release/veloce-run.exe
