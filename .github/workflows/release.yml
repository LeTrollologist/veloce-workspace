# Release workflow — triggered by any v* tag push.
#
# Flow:
#   1. Build veloce-core.exe + veloce-run.exe (Rust, release profile)
#   2. Build & publish the Dashboard via tauri-action:
#        - compiles the Tauri app, signs it with TAURI_SIGNING_PRIVATE_KEY
#        - creates update.json + uploads all artifacts to the GitHub Release
#   3. Stage binaries into apps/installer/src-tauri/resources/
#   4. Build the full installer NSIS bundle and attach it to the same release
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          — ed25519 private key (minisign format)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — passphrase for the key (may be empty)
#
# Generate keypair locally:
#   npx @tauri-apps/cli signer generate -w veloce-update.key
# Then add the private key file contents to TAURI_SIGNING_PRIVATE_KEY
# and paste the printed public key into apps/dashboard/src-tauri/tauri.conf.json
# under plugins.updater.pubkey.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write   # needed to create/update the GitHub Release

jobs:
  release-windows:
    name: Build & release (Windows x64)
    runs-on: windows-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Toolchains ───────────────────────────────────────────────────────────
      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Cargo cache ──────────────────────────────────────────────────────────
      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── 1. Build core service + CLI ──────────────────────────────────────────
      - name: Build veloce-core.exe and veloce-run.exe
        run: cargo build --release -p veloce-core -p veloce-run

      # ── 2. Build & publish Dashboard (generates update.json) ─────────────────
      - name: Install dashboard npm dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Build dashboard and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN:                        ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY:           ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD:  ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName:       ${{ github.ref_name }}
          releaseName:   "VeloceNetwork ${{ github.ref_name }}"
          releaseBody: |
            ## VeloceNetwork ${{ github.ref_name }}

            See [RELEASE_NOTES_v8-9.md](https://github.com/LeTrollologist/veloce-workspace/blob/main/RELEASE_NOTES_v8-9.md)
            for the full changelog.

            ### Auto-update
            Existing dashboard installs will receive an update prompt automatically.

            ### Fresh install
            Download `VeloceNetwork-Setup-${{ github.ref_name }}-x64.exe` below.
          releaseDraft:  true     # review before publishing
          prerelease:    false
          projectPath:   apps/dashboard

      # ── 3. Stage binaries for installer ──────────────────────────────────────
      - name: Stage binaries into installer resources
        run: |
          New-Item -ItemType Directory -Force apps/installer/src-tauri/resources | Out-Null
          Copy-Item target/release/veloce-core.exe `
                    apps/installer/src-tauri/resources/veloce-core.exe
          Copy-Item apps/dashboard/src-tauri/target/release/veloce-dashboard.exe `
                    apps/installer/src-tauri/resources/veloce-dashboard.exe

      # ── 4. Build the full setup installer ────────────────────────────────────
      - name: Install installer npm dependencies
        working-directory: apps/installer
        run: npm ci

      - name: Build installer NSIS bundle
        working-directory: apps/installer
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY:           ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD:  ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Attach installer and CLI to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft:    true
          files: |
            apps/installer/src-tauri/target/release/bundle/nsis/*.exe
            target/release/veloce-run.exe
