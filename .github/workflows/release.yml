name: Release Build & Binary Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.7.0)'
        required: true
        default: 'v4.7.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release Binaries (.exe / .dll / .zip / .vpack)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7b7c407752d8230469b848039911fc72c2b6499f # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075edd2367cf4999c6d8e # v2.7.3
        with:
          workspaces: Windows

      - name: Build Windows Binaries
        run: |
          cargo build --release --workspace
        working-directory: Windows

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $Tag = if ("${{ github.ref_name }}".StartsWith("v")) { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag }}" }
          if (-not $Tag) { $Tag = "v4.7.0" }
          $DistDir = "Windows/target/dist"
          New-Item -ItemType Directory -Force -Path $DistDir
          Copy-Item Windows/target/release/veloce-core.exe $DistDir/ -Force
          Copy-Item Windows/target/release/veloce-run.exe $DistDir/ -Force
          if (Test-Path Windows/target/release/veloce-launcher.exe) { Copy-Item Windows/target/release/veloce-launcher.exe $DistDir/ -Force }
          if (Test-Path Windows/target/release/veloce-shell.exe) { Copy-Item Windows/target/release/veloce-shell.exe $DistDir/ -Force }
          if (Test-Path Windows/target/release/veloce_sdk.dll) { Copy-Item Windows/target/release/veloce_sdk.dll $DistDir/ -Force }
          if (Test-Path Windows/veloce_sdk.h) { Copy-Item Windows/veloce_sdk.h $DistDir/ -Force }
          if (Test-Path Windows/README.md) { Copy-Item Windows/README.md $DistDir/ -Force }
          if (Test-Path Windows/SECURITY.md) { Copy-Item Windows/SECURITY.md $DistDir/ -Force }
          
          # Build .vpack package
          if (Test-Path Windows/target/release/veloce-run.exe) {
            & Windows/target/release/veloce-run.exe pack init $DistDir -n "veloce-runtime" || true
            & Windows/target/release/veloce-run.exe pack build $DistDir -o "veloce-runtime-$Tag-windows-x86_64.vpack" || true
          }

          Compress-Archive -Path "$DistDir/*" -DestinationPath "veloce-windows-x86_64-$Tag.zip" -Force
          Copy-Item Windows/target/release/veloce-core.exe "veloce-core-windows-x86_64.exe" -Force
          Copy-Item Windows/target/release/veloce-run.exe "veloce-run-windows-x86_64.exe" -Force

      - name: Upload Windows Assets to GitHub Release
        uses: softprops/action-gh-release@c062e4eec0c4b38d2049339664f33303ec5082b7 # v2.0.4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: |
            veloce-windows-x86_64-*.zip
            veloce-core-windows-x86_64.exe
            veloce-run-windows-x86_64.exe
            veloce-runtime-*-windows-x86_64.vpack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Release Binaries (tar.gz / zip / ELF / .vpack)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev zip

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@7b7c407752d8230469b848039911fc72c2b6499f # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075edd2367cf4999c6d8e # v2.7.3
        with:
          workspaces: Linux

      - name: Build Linux Binaries
        run: |
          cargo build --release --workspace
        working-directory: Linux

      - name: Package Linux Artifacts
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v4.7.0"
          fi
          mkdir -p Linux/target/dist
          cp Linux/target/release/veloce-core Linux/target/dist/
          cp Linux/target/release/veloce-run Linux/target/dist/
          if [ -f Linux/target/release/veloce-launcher ]; then
            cp Linux/target/release/veloce-launcher Linux/target/dist/
          fi
          if [ -f Linux/target/release/veloce-shell ]; then
            cp Linux/target/release/veloce-shell Linux/target/dist/
          fi
          if [ -f Linux/target/release/libveloce_sdk.so ]; then
            cp Linux/target/release/libveloce_sdk.so Linux/target/dist/
          fi
          if [ -f Linux/veloce_sdk.h ]; then
            cp Linux/veloce_sdk.h Linux/target/dist/
          fi
          if [ -f Linux/README.md ]; then
            cp Linux/README.md Linux/target/dist/
          fi
          if [ -f Linux/SECURITY.md ]; then
            cp Linux/SECURITY.md Linux/target/dist/
          fi
          
          # Build .vpack package
          if [ -f Linux/target/release/veloce-run ]; then
            Linux/target/release/veloce-run pack init Linux/target/dist -n "veloce-runtime" || true
            Linux/target/release/veloce-run pack build Linux/target/dist -o "veloce-runtime-${TAG}-linux-x86_64.vpack" || true
          fi

          tar -czvf "veloce-linux-x86_64-${TAG}.tar.gz" -C Linux/target/dist .
          (cd Linux/target/dist && zip -r "../../../veloce-linux-x86_64-${TAG}.zip" .)
          cp Linux/target/release/veloce-core "veloce-core-linux-x86_64"
          cp Linux/target/release/veloce-run "veloce-run-linux-x86_64"

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@c062e4eec0c4b38d2049339664f33303ec5082b7 # v2.0.4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: |
            veloce-linux-x86_64-*.tar.gz
            veloce-linux-x86_64-*.zip
            veloce-core-linux-x86_64
            veloce-run-linux-x86_64
            veloce-runtime-*-linux-x86_64.vpack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Release Binaries (tar.gz / zip / Mach-O / .vpack)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@7b7c407752d8230469b848039911fc72c2b6499f # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075edd2367cf4999c6d8e # v2.7.3
        with:
          workspaces: macOS

      - name: Build macOS Binaries
        run: |
          cargo build --release --workspace
        working-directory: macOS

      - name: Package macOS Artifacts
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v4.7.0"
          fi
          mkdir -p macOS/target/dist
          cp macOS/target/release/veloce-core macOS/target/dist/
          cp macOS/target/release/veloce-run macOS/target/dist/
          if [ -f macOS/README.md ]; then
            cp macOS/README.md macOS/target/dist/
          fi
          if [ -f macOS/SECURITY.md ]; then
            cp macOS/SECURITY.md macOS/target/dist/
          fi
          
          # Build .vpack package
          if [ -f macOS/target/release/veloce-run ]; then
            macOS/target/release/veloce-run pack init macOS/target/dist -n "veloce-runtime" || true
            macOS/target/release/veloce-run pack build macOS/target/dist -o "veloce-runtime-${TAG}-macos-aarch64.vpack" || true
          fi

          tar -czvf "veloce-macos-aarch64-${TAG}.tar.gz" -C macOS/target/dist .
          (cd macOS/target/dist && zip -r "../../../veloce-macos-aarch64-${TAG}.zip" .)
          cp macOS/target/release/veloce-core "veloce-core-macos-aarch64"
          cp macOS/target/release/veloce-run "veloce-run-macos-aarch64"

      - name: Upload macOS Assets to GitHub Release
        uses: softprops/action-gh-release@c062e4eec0c4b38d2049339664f33303ec5082b7 # v2.0.4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: |
            veloce-macos-aarch64-*.tar.gz
            veloce-macos-aarch64-*.zip
            veloce-core-macos-aarch64
            veloce-run-macos-aarch64
            veloce-runtime-*-macos-aarch64.vpack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
