name: CI — Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: dtolnay/rust-toolchain@7b7c407752d8230469b848039911fc72c2b6499f # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075edd2367cf4999c6d8e # v2.7.3
        with:
          workspaces: Windows

      - name: Build
        run: cargo build --release --workspace
        working-directory: Windows

      - name: Test
        run: cargo test --workspace
        working-directory: Windows

  build-linux:
    name: Linux (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@7b7c407752d8230469b848039911fc72c2b6499f # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075edd2367cf4999c6d8e # v2.7.3
        with:
          workspaces: Linux

      - name: Build
        run: cargo build --release --workspace
        working-directory: Linux

      - name: Test
        run: cargo test --workspace
        working-directory: Linux

  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: dtolnay/rust-toolchain@7b7c407752d8230469b848039911fc72c2b6499f # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075edd2367cf4999c6d8e # v2.7.3
        with:
          workspaces: macOS

      - name: Build (aarch64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin --workspace
          cargo build --release --target x86_64-apple-darwin  --workspace
        working-directory: macOS

      - name: Test
        run: cargo test --workspace
        working-directory: macOS
