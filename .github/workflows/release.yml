name: Release Build & Binary Distribution

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.5.0)'
        required: true
        default: 'v3.5.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release Binaries (.exe / .dll / .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Windows

      - name: Build Windows Binaries
        run: |
          cargo build --release --workspace
        working-directory: Windows

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $Tag = if ("${{ github.ref_name }}".StartsWith("v")) { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag }}" }
          if (-not $Tag) { $Tag = "v3.5.0" }
          $DistDir = "Windows/target/dist"
          New-Item -ItemType Directory -Force -Path $DistDir
          Copy-Item Windows/target/release/veloce-core.exe $DistDir/ -Force
          Copy-Item Windows/target/release/veloce-run.exe $DistDir/ -Force
          if (Test-Path Windows/target/release/veloce-launcher.exe) { Copy-Item Windows/target/release/veloce-launcher.exe $DistDir/ -Force }
          if (Test-Path Windows/target/release/veloce-shell.exe) { Copy-Item Windows/target/release/veloce-shell.exe $DistDir/ -Force }
          if (Test-Path Windows/target/release/veloce_sdk.dll) { Copy-Item Windows/target/release/veloce_sdk.dll $DistDir/ -Force }
          if (Test-Path Windows/veloce_sdk.h) { Copy-Item Windows/veloce_sdk.h $DistDir/ -Force }
          if (Test-Path Windows/README.md) { Copy-Item Windows/README.md $DistDir/ -Force }
          if (Test-Path Windows/SECURITY.md) { Copy-Item Windows/SECURITY.md $DistDir/ -Force }
          
          Compress-Archive -Path "$DistDir/*" -DestinationPath "veloce-windows-x86_64-$Tag.zip" -Force
          Copy-Item Windows/target/release/veloce-core.exe "veloce-core-windows-x86_64.exe" -Force
          Copy-Item Windows/target/release/veloce-run.exe "veloce-run-windows-x86_64.exe" -Force

      - name: Upload Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: |
            veloce-windows-x86_64-*.zip
            veloce-core-windows-x86_64.exe
            veloce-run-windows-x86_64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Release Binaries (tar.gz / zip / ELF)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev zip

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Linux

      - name: Build Linux Binaries
        run: |
          cargo build --release --workspace
        working-directory: Linux

      - name: Package Linux Artifacts
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v3.5.0"
          fi
          mkdir -p Linux/target/dist
          cp Linux/target/release/veloce-core Linux/target/dist/
          cp Linux/target/release/veloce-run Linux/target/dist/
          if [ -f Linux/target/release/veloce-launcher ]; then
            cp Linux/target/release/veloce-launcher Linux/target/dist/
          fi
          if [ -f Linux/target/release/veloce-shell ]; then
            cp Linux/target/release/veloce-shell Linux/target/dist/
          fi
          if [ -f Linux/target/release/libveloce_sdk.so ]; then
            cp Linux/target/release/libveloce_sdk.so Linux/target/dist/
          fi
          if [ -f Linux/veloce_sdk.h ]; then
            cp Linux/veloce_sdk.h Linux/target/dist/
          fi
          if [ -f Linux/README.md ]; then
            cp Linux/README.md Linux/target/dist/
          fi
          if [ -f Linux/SECURITY.md ]; then
            cp Linux/SECURITY.md Linux/target/dist/
          fi
          
          tar -czvf "veloce-linux-x86_64-${TAG}.tar.gz" -C Linux/target/dist .
          (cd Linux/target/dist && zip -r "../../../veloce-linux-x86_64-${TAG}.zip" .)
          cp Linux/target/release/veloce-core "veloce-core-linux-x86_64"
          cp Linux/target/release/veloce-run "veloce-run-linux-x86_64"

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: |
            veloce-linux-x86_64-*.tar.gz
            veloce-linux-x86_64-*.zip
            veloce-core-linux-x86_64
            veloce-run-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
