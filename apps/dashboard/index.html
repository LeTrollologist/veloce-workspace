<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VeloceNetwork Dashboard</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">

    <!-- ── Header ── -->
    <header>
      <div class="brand">
        <span class="brand-v">V</span>eloceNetwork
      </div>
      <div class="status-bar">
        <span id="status-dot" class="dot"></span>
        <span id="status-label">Disconnected</span>
        <button id="btn-connect" class="btn btn-primary">Connect</button>
      </div>
    </header>

    <!-- ── Tabs ── -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="nodes">Nodes</button>
      <button class="tab-btn"        data-tab="network">VeloceNet</button>
    </nav>

    <!-- ── Nodes Panel ── -->
    <section id="tab-nodes" class="tab-panel active">
      <div class="panel-row">
        <h2>Running Nodes</h2>
        <button id="btn-refresh" class="btn btn-ghost">↻ Refresh</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>PID</th>
              <th>Status</th>
              <th>Spawned</th>
              <th>Node ID</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="node-list">
            <tr id="node-empty-row">
              <td colspan="6" class="empty-cell">No nodes running</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card spawn-card">
        <h3>Spawn Node</h3>
        <div class="form-row">
          <input id="spawn-name" class="input" placeholder="App name" />
          <input id="spawn-exe"  class="input wide" placeholder="C:\path\to\app.exe" />
          <button id="btn-spawn" class="btn btn-primary">Spawn</button>
        </div>
        <div id="spawn-result" class="result hidden"></div>
      </div>
    </section>

    <!-- ── Network Panel ── -->
    <section id="tab-network" class="tab-panel">
      <div class="card">
        <h3>Register Host</h3>
        <div class="form-row">
          <input id="net-hostname"  class="input"       placeholder="myapp.vln" />
          <input id="net-node-id"   class="input wide"  placeholder="Node UUID" />
          <input id="net-port"      class="input narrow" type="number" placeholder="Port" />
          <input id="net-ttl"       class="input narrow" type="number" placeholder="TTL (s)" value="0" />
          <button id="btn-register" class="btn btn-primary">Register</button>
        </div>
        <div id="reg-result" class="result hidden"></div>
      </div>

      <div class="card">
        <h3>Unregister Host</h3>
        <div class="form-row">
          <input id="unreg-hostname"  class="input" placeholder="myapp.vln" />
          <button id="btn-unregister" class="btn btn-danger">Unregister</button>
        </div>
        <div id="unreg-result" class="result hidden"></div>
      </div>
    </section>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
