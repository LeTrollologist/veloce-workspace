<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VeloceNetwork Setup</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

<!-- Animated background mesh -->
<div class="bg-layer" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Custom titlebar (drag region) -->
<div class="titlebar" data-tauri-drag-region>
  <span class="titlebar-title" data-tauri-drag-region>VeloceNetwork Setup</span>
  <div class="titlebar-controls">
    <button id="btn-minimize" class="tb-btn" title="Minimize">&#8722;</button>
    <button id="btn-close"    class="tb-btn tb-close" title="Close">&#10005;</button>
  </div>
</div>

<!-- Main installer layout -->
<div class="installer">

  <!-- Left sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-name">VeloceNetwork</span>
    </div>
    <nav class="step-nav" id="step-nav">
      <!-- Rendered by JS -->
    </nav>
    <div class="sidebar-version">v1.1.0</div>
  </aside>

  <!-- Right content panel -->
  <main class="content-panel" id="content-panel">
    <!-- Steps rendered by JS -->
  </main>

</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
