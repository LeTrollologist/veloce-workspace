[workspace]
resolver = "2"
members = [
    "crates/veloce-ipc",
    "crates/veloce-core",
    "crates/veloce-net",
    "crates/veloce-mesh",
    "crates/veloce-sdk",
    "apps/veloce-run",
    "apps/veloce-launcher",
    "apps/veloce-shell",
]

[workspace.package]
version     = "1.0.0"
edition     = "2021"
authors     = ["VeloceSolutions"]
license     = "proprietary"

[workspace.dependencies]
# Async runtime
tokio       = { version = "1", features = ["full"] }

# Serialisation
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
bincode     = "1"
bytes       = "1"

# Error handling
anyhow      = "1"
thiserror   = "1"

# Logging
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap        = { version = "4", features = ["derive"] }
ctrlc       = "3"

# Utils
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
memmap2     = "0.9"
parking_lot = "0.12"

# Windows-specific (kept for version pinning; only used by Windows cfg-gated code)
winreg           = "0.52"
windows-service  = "0.6"
windows          = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Networking_WinSock",
    "Win32_Security_Isolation",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }

# Linux-specific (only used by Linux cfg-gated code)
nix              = { version = "0.29", features = ["socket", "process", "signal", "user"] }
libc             = "0.2"
sd-notify        = "0.4"
chacha20poly1305 = "0.10"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 4
strip         = true

[profile.release-fat]
inherits      = "release"
lto           = true
codegen-units = 1
